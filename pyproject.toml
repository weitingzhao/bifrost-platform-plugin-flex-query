[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bifrost-flex-query"
version = "0.6.3"
description = "Bifrost IB Flex Query Plugin — scheduled Flex ingest into brokerage.*"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "psycopg2-binary>=2.9",
  "pyyaml>=6.0",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.8",
]
runtime = [
  "bifrost-core",
]

[project.scripts]
flex-query-worker = "bifrost_flex_query.worker.runner:main"
flex-query-schedule = "bifrost_flex_query.scheduler.daily:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
