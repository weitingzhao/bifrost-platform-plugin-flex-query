apiVersion: v1
kind: ConfigMap
metadata:
  name: flex-query-schedule
  labels:
    app.kubernetes.io/name: flex-query
data:
  # Mirror of config/schedule.yaml — planned fire times (dashboard) + attempt budget.
  # The trigger is Dagster research_flex_morning_schedule (bifrost-research).
  schedule.yaml: |
    scheduler:
      timezone: America/New_York
      slots:
        flex-trades:
          cron: "30 6 * * 1-6"
          priority: 5
          max_attempts: 8
        flex-transactions:
          cron: "30 6 * * 1-6"
          priority: 4
          max_attempts: 8
      # A planned slot with no job this long after firing is enqueued by the worker itself.
      catchup_grace_sec: 2700
      retry:
        not_ready_delay_sec: 1800
        throttled_delay_sec: 1800
        transient_delay_sec: 120
        unknown_delay_sec: 300
