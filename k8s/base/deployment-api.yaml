apiVersion: apps/v1
kind: Deployment
metadata:
  name: flex-query-api
  labels:
    app.kubernetes.io/name: flex-query-api
    bifrost.flex-query/role: api
spec:
  replicas: 1
  # Rolled, not recreated: Recreate left /api/plugin/flex-query with no pod on every
  # release, and each Trade gateway answered 503. The API is stateless; claiming and
  # running jobs is flex-query-worker's, which stays Recreate.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: flex-query-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flex-query-api
        bifrost.flex-query/role: api
        app.kubernetes.io/part-of: bifrost-flex-query
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: bifrost-flex-query:0.9.0
          imagePullPolicy: IfNotPresent
          args: ["python", "scripts/run_api.py"]
          env:
            - name: FLEX_QUERY_CONFIG
              value: /config/flex-query.yaml
            - name: SCHEDULE_CONFIG
              value: /config/schedule.yaml
            - name: FLEX_QUERY_API_HOST
              value: "0.0.0.0"
            - name: FLEX_QUERY_API_PORT
              value: "8791"
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: flex-query-secrets
                  key: postgres-host
                  optional: true
            # D6 (2026-10-04): the login, next to its passwords, so a switch or a rollback is one
            # Secret patch. One key names the role on all three connections (ops_jobs queue, Golden
            # Source raw_broker writes through core, the Trade database read). Absent key -> the
            # ConfigMap's user lines.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: flex-query-secrets
                  key: postgres-user
                  optional: true
            - name: GOLDEN_SOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: flex-query-secrets
                  key: postgres-user
                  optional: true
            - name: FLEX_TRADE_PG_USER
              valueFrom:
                secretKeyRef:
                  name: flex-query-secrets
                  key: postgres-user
                  optional: true
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flex-query-secrets
                  key: postgres-password
                  optional: true
            - name: FLEX_QUERY_WRITE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: flex-query-secrets
                  key: write-token
                  optional: true
            - name: FLEX_TRADE_PG_HOST
              valueFrom:
                secretKeyRef:
                  name: flex-query-secrets
                  key: trade-pg-host
                  optional: true
            - name: FLEX_TRADE_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flex-query-secrets
                  key: trade-pg-password
                  optional: true
            # Same database as the worker (it read only the ConfigMap's fallback before 0.9.0).
            - name: FLEX_TRADE_PG_DB
              valueFrom:
                secretKeyRef:
                  name: flex-query-secrets
                  key: trade-pg-db
                  optional: true
          envFrom:
            - secretRef:
                name: bifrost-flex-tokens
                optional: false
          ports:
            - name: http
              containerPort: 8791
          volumeMounts:
            - name: config
              mountPath: /config/flex-query.yaml
              subPath: flex-query.yaml
              readOnly: true
            - name: schedule
              mountPath: /config/schedule.yaml
              subPath: schedule.yaml
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: config
          configMap:
            name: flex-query-config
        - name: schedule
          configMap:
            name: flex-query-schedule
