---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: flex-query-trades
  namespace: plugin-flex-query
  labels:
    app.kubernetes.io/name: flex-query-trades
    app.kubernetes.io/part-of: bifrost-flex-query
    bifrost.flex-query/slot: flex-trades
spec:
  schedule: "30 22 * * 1-5"
  timeZone: UTC
  # Suspended: Dagster research_trading_day / plugin_batch owns this slot
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/name: flex-query-trades
            app.kubernetes.io/part-of: bifrost-flex-query
            bifrost.flex-query/slot: flex-trades
        spec:
          restartPolicy: Never
          containers:
            - name: scheduler
              image: 192.168.10.73:30500/bifrost-flex-query:0.5.2
              imagePullPolicy: IfNotPresent
              args:
                - python
                - -m
                - bifrost_flex_query.scheduler.daily
                - --slot
                - flex-trades
              env:
                - name: FLEX_QUERY_CONFIG
                  value: /config/flex-query.yaml
                - name: SCHEDULE_CONFIG
                  value: /config/schedule.yaml
                - name: POSTGRES_HOST
                  valueFrom:
                    secretKeyRef:
                      name: flex-query-secrets
                      key: postgres-host
                      optional: true
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: flex-query-secrets
                      key: postgres-password
                      optional: true
              envFrom:
                - secretRef:
                    name: bifrost-flex-tokens
                    optional: false
              volumeMounts:
                - name: config
                  mountPath: /config/flex-query.yaml
                  subPath: flex-query.yaml
                  readOnly: true
                - name: schedule
                  mountPath: /config/schedule.yaml
                  subPath: schedule.yaml
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          volumes:
            - name: config
              configMap:
                name: flex-query-config
            - name: schedule
              configMap:
                name: flex-query-schedule
